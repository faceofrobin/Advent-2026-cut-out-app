<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Advent Cutout Studio V3</title><style>body{margin:0;background:#111;color:#eee;font-family:Arial}.app{display:grid;grid-template-columns:260px 1fr;height:100vh}.side{background:#1d1d22;padding:12px;overflow:auto}.stageWrap{padding:12px}.stage{width:100%;height:calc(100vh - 24px);border:4px solid #333;border-radius:12px;background:#f0ede6}.btn{background:#e85d3a;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-bottom:8px}.swatch{height:60px;border-radius:10px;margin-bottom:8px;cursor:pointer;display:flex;align-items:end;padding:6px;font-weight:bold}.cut{background:#333;padding:4px;border-radius:8px;margin-bottom:8px;cursor:pointer}.cut canvas{max-width:100%}#cutModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);align-items:center;justify-content:center;flex-direction:column}#cutCanvas{background:#fff;max-width:90vw;max-height:70vh}.controls{margin-top:12px;padding-top:12px;border-top:1px solid #444}</style></head><body><div class='app'><div class='side'><button class='btn' onclick='loadWiki()'>Random Wikimedia</button><label class='btn'>Upload Photo<input type='file' accept='image/*' hidden onchange='uploadPhoto(event)'></label><div id='papers'></div><h3>Cutouts</h3><div id='bin'></div><div class='controls'><h3>Background</h3><input type='color' value='#f0ede6' onchange='bgColor=this.value;render()'><br><br><label class='btn'>Background Image<input type='file' accept='image/*' hidden onchange='uploadBG(event)'></label><button class='btn' onclick='dots=!dots;render()'>Toggle Dots</button></div></div><div class='stageWrap'><canvas id='stage' class='stage'></canvas></div></div><div id='cutModal'><h2>Draw Shape</h2><canvas id='cutCanvas'></canvas><div><button class='btn' onclick='finishCut()'>Cut</button><button class='btn' onclick='closeCut()'>Cancel</button></div></div><script>const colors=['#e85d3a','#3a7be8','#f0c93a','#3ab858','#9a4ae8','#2a2a2a'];const papers=document.getElementById('papers');colors.forEach(c=>{let d=document.createElement('div');d.className='swatch';d.style.background=c;d.innerHTML=c;d.onclick=()=>openCut({type:'color',color:c});papers.appendChild(d)});const stage=document.getElementById('stage'),ctx=stage.getContext('2d');const cutCanvas=document.getElementById('cutCanvas'),cctx=cutCanvas.getContext('2d');let bgColor='#f0ede6',dots=true,bgImage=null,items=[],bin=[],drag=null,offx=0,offy=0,currentImage=null,path=[],drawing=false;function resize(){stage.width=stage.clientWidth*2;stage.height=stage.clientHeight*2;render()}window.onresize=resize;setTimeout(resize,50);function render(){ctx.fillStyle=bgColor;ctx.fillRect(0,0,stage.width,stage.height);if(bgImage)ctx.drawImage(bgImage,0,0,stage.width,stage.height);if(dots){ctx.fillStyle='rgba(0,0,0,.08)';for(let x=20;x<stage.width;x+=40)for(let y=20;y<stage.height;y+=40)ctx.fillRect(x,y,3,3)}items.forEach(it=>ctx.drawImage(it.img,it.x,it.y,it.w,it.h))}function openCut(src){document.getElementById('cutModal').style.display='flex';path=[];cutCanvas.width=800;cutCanvas.height=600;if(src.type==='color'){cctx.fillStyle=src.color;cctx.fillRect(0,0,800,600)}else{cctx.drawImage(src.img,0,0,800,600);currentImage=src.img}}function closeCut(){document.getElementById('cutModal').style.display='none'}cutCanvas.onpointerdown=e=>{drawing=true;path=[[e.offsetX,e.offsetY]]};cutCanvas.onpointermove=e=>{if(!drawing)return;let p=[e.offsetX,e.offsetY];let q=path[path.length-1];path.push(p);cctx.strokeStyle='white';cctx.lineWidth=3;cctx.beginPath();cctx.moveTo(q[0],q[1]);cctx.lineTo(p[0],p[1]);cctx.stroke()};cutCanvas.onpointerup=()=>drawing=false;function finishCut(){let out=document.createElement('canvas');out.width=300;out.height=300;let o=out.getContext('2d');o.save();o.beginPath();o.moveTo(path[0][0],path[0][1]);path.forEach(p=>o.lineTo(p[0],p[1]));o.clip();o.drawImage(cutCanvas,0,0);o.restore();bin.push(out);renderBin();closeCut()}function renderBin(){let b=document.getElementById('bin');b.innerHTML='';bin.forEach(c=>{let d=document.createElement('div');d.className='cut';let t=document.createElement('canvas');t.width=120;t.height=80;t.getContext('2d').drawImage(c,0,0,120,80);d.appendChild(t);d.onclick=()=>{items.push({img:c,x:100,y:100,w:200,h:200});render()};b.appendChild(d)})}async function loadWiki(){const proxy='https://cors.isomorphic-git.org/';const res=await fetch(proxy+'https://randomincategory.toolforge.org/Featured_pictures_on_Wikimedia_Commons?server=commons.wikimedia.org&type=file&debug=1');const txt=await res.text();const m=txt.match(/wiki\/(.*)/);if(!m)return;const title=encodeURIComponent(m[1].replace('<br>',''));const api='https://commons.wikimedia.org/w/api.php?action=query&titles='+title+'&prop=pageimages&format=json&pithumbsize=1200&origin=*';const data=await fetch(api).then(r=>r.json());const key=Object.keys(data.query.pages)[0];const src=data.query.pages[key].thumbnail.source;const img=new Image();img.crossOrigin='anonymous';img.onload=()=>openCut({type:'image',img});img.src=src}function uploadPhoto(e){const f=e.target.files[0];const img=new Image();img.onload=()=>openCut({type:'image',img});img.src=URL.createObjectURL(f)}function uploadBG(e){const f=e.target.files[0];const img=new Image();img.onload=()=>{bgImage=img;render()};img.src=URL.createObjectURL(f)}stage.onpointerdown=e=>{let r=stage.getBoundingClientRect(),x=(e.clientX-r.left)*2,y=(e.clientY-r.top)*2;for(let i=items.length-1;i>=0;i--){let it=items[i];if(x>it.x&&x<it.x+it.w&&y>it.y&&y<it.y+it.h){drag=it;offx=x-it.x;offy=y-it.y}}};stage.onpointermove=e=>{if(!drag)return;let r=stage.getBoundingClientRect(),x=(e.clientX-r.left)*2,y=(e.clientY-r.top)*2;drag.x=x-offx;drag.y=y-offy;render()};stage.onpointerup=()=>drag=null;</script></body></html>
