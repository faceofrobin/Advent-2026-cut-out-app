  <script>
// Minimal GIF encoder (LZW-based)
class GIFEncoder{constructor(w,h){this.width=w;this.height=h;this.frames=[];this.delay=1000;}
setDelay(d){this.delay=d;}
addFrame(ctx){const imageData=ctx.getImageData(0,0,this.width,this.height);this.frames.push(imageData);}
finish(){return this._encode();}
_encode(){const w=this.width,h=this.height;const buf=[];
// Header
buf.push(0x47,0x49,0x46,0x38,0x39,0x61);
buf.push(w&0xFF,(w>>8)&0xFF,h&0xFF,(h>>8)&0xFF);
// Build global color table from first frame or use 256 colors
const palette=this._buildPalette();
const palSize=256;
buf.push(0xF7,0x00,0x00);// GCT flag, 256 colors
for(let i=0;i<palSize;i++){buf.push(palette[i*3],palette[i*3+1],palette[i*3+2]);}
// Netscape extension for looping
buf.push(0x21,0xFF,0x0B);
const ns="NETSCAPE2.0";for(let i=0;i<ns.length;i++)buf.push(ns.charCodeAt(i));
buf.push(0x03,0x01,0x00,0x00,0x00);
for(const frame of this.frames){
const indexed=this._quantize(frame,palette);
const delay=Math.round(this.delay/10);
// Graphic control extension
buf.push(0x21,0xF9,0x04,0x00,delay&0xFF,(delay>>8)&0xFF,0x00,0x00);
// Image descriptor
buf.push(0x2C,0x00,0x00,0x00,0x00,w&0xFF,(w>>8)&0xFF,h&0xFF,(h>>8)&0xFF,0x00);
// LZW min code size
const minCodeSize=8;
buf.push(minCodeSize);
const lzw=this._lzwEncode(indexed,minCodeSize);
// Sub-blocks
let pos=0;
while(pos<lzw.length){const sz=Math.min(255,lzw.length-pos);buf.push(sz);for(let i=0;i<sz;i++)buf.push(lzw[pos+i]);pos+=sz;}
buf.push(0x00);
}
buf.push(0x3B);
return new Uint8Array(buf);
}
_buildPalette(){const p=new Uint8Array(768);
// 6x6x6 color cube + extras
let idx=0;
for(let r=0;r<6;r++)for(let g=0;g<6;g++)for(let b=0;b<6;b++){
p[idx*3]=Math.round(r*51);p[idx*3+1]=Math.round(g*51);p[idx*3+2]=Math.round(b*51);idx++;}
for(;idx<256;idx++){const v=Math.round((idx-216)*255/39);p[idx*3]=v;p[idx*3+1]=v;p[idx*3+2]=v;}
return p;}
_quantize(imageData,palette){const d=imageData.data;const out=new Uint8Array(d.length/4);
for(let i=0;i<out.length;i++){
const r=d[i*4],g=d[i*4+1],b=d[i*4+2];
const ri=Math.round(r/51),gi=Math.round(g/51),bi=Math.round(b/51);
out[i]=ri*36+gi*6+bi;}return out;}
_lzwEncode(indexed,minCodeSize){const clearCode=1<<minCodeSize;const eoiCode=clearCode+1;
let codeSize=minCodeSize+1;let nextCode=eoiCode+1;const output=[];
let table=new Map();for(let i=0;i<clearCode;i++)table.set(String(i),i);
let bitBuf=0,bitPos=0;
const writeBits=(code,size)=>{bitBuf|=(code<<bitPos);bitPos+=size;while(bitPos>=8){output.push(bitBuf&0xFF);bitBuf>>=8;bitPos-=8;}};
writeBits(clearCode,codeSize);
let prefix=String(indexed[0]);
for(let i=1;i<indexed.length;i++){
const k=String(indexed[i]);const combined=prefix+","+k;
if(table.has(combined)){prefix=combined;}
else{writeBits(table.get(prefix),codeSize);
if(nextCode<4096){table.set(combined,nextCode);nextCode++;
if(nextCode>(1<<codeSize)&&codeSize<12)codeSize++;}
else{writeBits(clearCode,codeSize);table=new Map();for(let j=0;j<clearCode;j++)table.set(String(j),j);nextCode=eoiCode+1;codeSize=minCodeSize+1;}
prefix=k;}}
writeBits(table.get(prefix),codeSize);
writeBits(eoiCode,codeSize);
if(bitPos>0)output.push(bitBuf&0xFF);
return output;}
}
</script>

       <div class="flex items-center gap-2"><label style="color:#888;font-size:11px;font-weight:600;">Speed:</label> <select id="speedControl" style="background:#333;color:#f0ede6;border:1px solid #444;border-radius:4px;padding:3px 6px;font-size:11px;font-weight:500;cursor:pointer;" onchange="updateAnimationSpeed(this.value)"> <option value="500">Slow (0.5s)</option> <option value="1000" selected="">Normal (1s)</option> <option value="500">Fast (0.5s)</option> <option value="250">Very Fast (0.25s)</option> </select>
       </div>
      </div>
      <div id="timeline" class="flex gap-2 overflow-x-auto pb-1" style="min-height:60px;align-items:center;">
       <div style="color:#555;font-size:12px;padding:10px;">
        Capture frames to build your animation →
       </div>
      </div>
     </div>
    </main>
   </div><!-- Cutting modal overlay -->
   <div id="cuttingModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;flex-direction:column;align-items:center;justify-content:center;">
    <div style="color:#f0ede6;font-size:14px;margin-bottom:8px;font-weight:700;">
     Draw around the shape you want to cut out
    </div>
    <div style="position:relative;display:inline-block;">
     <canvas id="cuttingCanvas" class="cutting-canvas" style="border-radius:8px;max-width:90%;max-height:60%;"></canvas>
    </div>
    <div class="flex gap-2 mt-3">
     <button class="btn-primary btn-sm" onclick="finishCut()" style="background: rgb(232, 93, 58);"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="scissors" style="width:14px;height:14px;display:inline;vertical-align:middle;" class="lucide lucide-scissors"><circle cx="6" cy="6" r="3"></circle><path d="M8.12 8.12 12 12"></path><path d="M20 4 8.12 15.88"></path><circle cx="6" cy="18" r="3"></circle><path d="M14.8 14.8 20 20"></path></svg> Cut Shape</button> <button class="btn-secondary btn-sm" onclick="closeCutting()" style="background: rgb(42, 42, 42);">Cancel</button> <button class="btn-secondary btn-sm" onclick="clearCutPath()" style="background: rgb(42, 42, 42);">Clear Path</button>
    </div>
   </div>
   <div id="toast" class="toast"></div><!-- GIF Lightbox -->
   <div id="gifLightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:200;flex-direction:column;align-items:center;justify-content:center;">
    <button style="position:absolute;top:20px;right:20px;background:none;border:none;color:#f0ede6;font-size:32px;cursor:pointer;line-height:1;" onclick="closeLightbox()">×</button> <img id="lightboxImage" style="max-width:90%;max-height:80vh;border-radius:8px;object-fit:contain;">
    <p id="lightboxInfo" style="color:#aaa;margin-top:12px;font-size:12px;"></p>
   </div><!-- Code Export Block -->
   <div style="position:fixed;bottom:20px;right:20px;background:#333;border:2px solid #e85d3a;border-radius:8px;padding:12px;z-index:500;"><button class="btn-primary btn-sm flex items-center gap-1" onclick="copyHTMLCode()" style="display: flex; align-items: center; gap: 8px; white-space: nowrap; background: rgb(232, 93, 58);"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="copy" style="width:14px;height:14px;" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg> Copy HTML Code </button>
   </div>
  </div>
  <script>
// --- State ---
const PAPERS = [
  {name:'Red',color:'#e85d3a'},{name:'Blue',color:'#3a7be8'},{name:'Yellow',color:'#f0c93a'},
  {name:'Green',color:'#3ab858'},{name:'Purple',color:'#9a4ae8'},{name:'Orange',color:'#f09a3a'},
  {name:'Pink',color:'#e84a8a'},{name:'Teal',color:'#3ac4b8'},{name:'Brown',color:'#8b6543'},{name:'Black',color:'#2a2a2a'}
];

let binItems = []; // {id, canvas, width, height}
let stageItems = []; // {id, binId, x, y, width, height, canvas}
let frames = []; // array of dataURL strings
let exportedGIFs = []; // {id, blob, dataURL, timestamp}
let selectedFrame = -1;

// Cutting state
let cuttingSource = null; // {type:'paper',color} or {type:'image',img}
let cutPath = [];
let isCutting = false;

// Stage drag state
let dragItem = null;
let dragOffsetX = 0, dragOffsetY = 0;
let isDraggingFromBin = false;
let binDragItem = null;

// --- Canvas setup ---
const stageCanvas = document.getElementById('stageCanvas');
const stageCtx = stageCanvas.getContext('2d');
const cuttingCanvas = document.getElementById('cuttingCanvas');
const cuttingCtx = cuttingCanvas.getContext('2d');

function resizeStage() {
  const container = document.getElementById('stageContainer');
  const rect = container.getBoundingClientRect();
  stageCanvas.width = rect.width;
  stageCanvas.height = rect.height;
  renderStage();
}

window.addEventListener('resize', resizeStage);
setTimeout(resizeStage, 50);

// --- Paper grid ---
function renderPapers() {
  const grid = document.getElementById('paperGrid');
  grid.innerHTML = '';
  PAPERS.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'paper-sheet rounded-lg';
    div.style.cssText = `background:${p.color};height:60px;display:flex;align-items:end;padding:4px 6px;`;
    div.innerHTML = `<span style="font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-weight:700;">${p.name}</span>`;
    div.onclick = () => openCutting({type:'paper', color:p.color});
    grid.appendChild(div);
  });
}
renderPapers();

// --- Sidebar switching ---
function switchSidebar(mode) {
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('papersPanel').style.display = mode === 'papers' ? '' : 'none';
  document.getElementById('binPanel').style.display = mode === 'bin' ? '' : 'none';
  document.getElementById('gifsPanel').style.display = mode === 'gifs' ? '' : 'none';
  document.getElementById('uploadPanel').style.display = mode === 'upload' ? '' : 'none';
}

// --- Image upload ---
function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const div = document.createElement('div');
      const thumb = document.createElement('canvas');
      thumb.width = 80; thumb.height = 60;
      const tc = thumb.getContext('2d');
      const scale = Math.min(80/img.width, 60/img.height);
      tc.drawImage(img, (80-img.width*scale)/2, (60-img.height*scale)/2, img.width*scale, img.height*scale);
      div.className = 'paper-sheet rounded-lg overflow-hidden cursor-pointer';
      div.style.cssText = 'height:60px;background:#333;display:flex;align-items:center;justify-content:center;';
      div.innerHTML = `<img src="${thumb.toDataURL()}" style="max-width:100%;max-height:100%;">`;
      div.onclick = () => openCutting({type:'image', img});
      document.getElementById('uploadedPapers').appendChild(div);
      showToast('Image loaded! Click it to cut shapes.');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// --- Cutting modal ---
function openCutting(source) {
  cuttingSource = source;
  cutPath = [];
  isCutting = false;
  const modal = document.getElementById('cuttingModal');
  modal.style.display = 'flex';

  const maxW = Math.min(window.innerWidth * 0.8, 600);
  const maxH = window.innerHeight * 0.55;

  if (source.type === 'paper') {
    const w = Math.min(400, maxW), h = Math.min(400, maxH);
    cuttingCanvas.width = w; cuttingCanvas.height = h;
    cuttingCtx.fillStyle = source.color;
    cuttingCtx.fillRect(0, 0, w, h);
    // Add paper texture
    cuttingCtx.globalAlpha = 0.08;
    for (let i = 0; i < 200; i++) {
      cuttingCtx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
      cuttingCtx.fillRect(Math.random()*w, Math.random()*h, Math.random()*3+1, Math.random()*3+1);
    }
    cuttingCtx.globalAlpha = 1;
  } else {
    const img = source.img;
    const scale = Math.min(maxW/img.width, maxH/img.height, 1);
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    cuttingCanvas.width = w; cuttingCanvas.height = h;
    cuttingCtx.drawImage(img, 0, 0, w, h);
  }
  setTimeout(() => lucide.createIcons(), 50);
}

function closeCutting() {
  document.getElementById('cuttingModal').style.display = 'none';
  cutPath = [];
}

function clearCutPath() {
  cutPath = [];
  // Redraw source
  if (cuttingSource.type === 'paper') {
    cuttingCtx.fillStyle = cuttingSource.color;
    cuttingCtx.fillRect(0, 0, cuttingCanvas.width, cuttingCanvas.height);
    cuttingCtx.globalAlpha = 0.08;
    for (let i = 0; i < 200; i++) {
      cuttingCtx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
      cuttingCtx.fillRect(Math.random()*cuttingCanvas.width, Math.random()*cuttingCanvas.height, Math.random()*3+1, Math.random()*3+1);
    }
    cuttingCtx.globalAlpha = 1;
  } else {
    const img = cuttingSource.img;
    cuttingCtx.drawImage(img, 0, 0, cuttingCanvas.width, cuttingCanvas.height);
  }
}

// Cutting canvas events
cuttingCanvas.addEventListener('pointerdown', (e) => {
  const rect = cuttingCanvas.getBoundingClientRect();
  const scaleX = cuttingCanvas.width / rect.width;
  const scaleY = cuttingCanvas.height / rect.height;
  cutPath = [{x: (e.clientX - rect.left)*scaleX, y: (e.clientY - rect.top)*scaleY}];
  isCutting = true;
  cuttingCanvas.setPointerCapture(e.pointerId);
});

cuttingCanvas.addEventListener('pointermove', (e) => {
  if (!isCutting) return;
  const rect = cuttingCanvas.getBoundingClientRect();
  const scaleX = cuttingCanvas.width / rect.width;
  const scaleY = cuttingCanvas.height / rect.height;
  const pt = {x: (e.clientX - rect.left)*scaleX, y: (e.clientY - rect.top)*scaleY};
  cutPath.push(pt);
  // Draw path
  if (cutPath.length > 1) {
    cuttingCtx.strokeStyle = '#fff';
    cuttingCtx.lineWidth = 2;
    cuttingCtx.setLineDash([5,5]);
    cuttingCtx.beginPath();
    cuttingCtx.moveTo(cutPath[cutPath.length-2].x, cutPath[cutPath.length-2].y);
    cuttingCtx.lineTo(pt.x, pt.y);
    cuttingCtx.stroke();
    cuttingCtx.setLineDash([]);
  }
});

cuttingCanvas.addEventListener('pointerup', () => { isCutting = false; });

function finishCut() {
  if (cutPath.length < 10) { showToast('Draw a larger shape first!'); return; }

  // Get bounding box
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  cutPath.forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);});
  minX=Math.max(0,Math.floor(minX));minY=Math.max(0,Math.floor(minY));
  maxX=Math.min(cuttingCanvas.width,Math.ceil(maxX));maxY=Math.min(cuttingCanvas.height,Math.ceil(maxY));
  const w=maxX-minX,h=maxY-minY;
  if(w<5||h<5){showToast('Shape too small!');return;}

  // Create cutout canvas
  // First redraw source clean
  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = cuttingCanvas.width; srcCanvas.height = cuttingCanvas.height;
  const srcCtx = srcCanvas.getContext('2d');
  if (cuttingSource.type === 'paper') {
    srcCtx.fillStyle = cuttingSource.color;
    srcCtx.fillRect(0,0,srcCanvas.width,srcCanvas.height);
    srcCtx.globalAlpha=0.08;
    for(let i=0;i<200;i++){srcCtx.fillStyle=Math.random()>.5?'#fff':'#000';srcCtx.fillRect(Math.random()*srcCanvas.width,Math.random()*srcCanvas.height,Math.random()*3+1,Math.random()*3+1);}
    srcCtx.globalAlpha=1;
  } else {
    srcCtx.drawImage(cuttingSource.img,0,0,srcCanvas.width,srcCanvas.height);
  }

  const cutCanvas = document.createElement('canvas');
  cutCanvas.width=w; cutCanvas.height=h;
  const cutCtx=cutCanvas.getContext('2d');
  cutCtx.save();
  cutCtx.beginPath();
  cutCtx.moveTo(cutPath[0].x-minX,cutPath[0].y-minY);
  cutPath.forEach(p=>cutCtx.lineTo(p.x-minX,p.y-minY));
  cutCtx.closePath();
  cutCtx.clip();
  cutCtx.drawImage(srcCanvas,-minX,-minY);
  cutCtx.restore();

  const id = 'cut_'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
  binItems.push({id,canvas:cutCanvas,width:w,height:h});
  renderBin();
  closeCutting();
  switchSidebar('bin');
  showToast('Shape added to bin!');
}

// --- Bin ---
function renderBin() {
  const grid = document.getElementById('binGrid');
  grid.innerHTML = '';
  binItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'bin-item rounded-lg overflow-hidden';
    div.style.cssText = 'height:60px;background:#333;display:flex;align-items:center;justify-content:center;position:relative;cursor:grab;';
    div.draggable = false;
    const thumb = document.createElement('canvas');
    thumb.width=76;thumb.height=56;
    const tc=thumb.getContext('2d');
    const scale=Math.min(76/item.width,56/item.height,1);
    tc.drawImage(item.canvas,(76-item.width*scale)/2,(56-item.height*scale)/2,item.width*scale,item.height*scale);
    thumb.style.cssText='max-width:100%;max-height:100%;pointer-events:none;';
    div.appendChild(thumb);
    // Delete button
    const del = document.createElement('button');
    del.innerHTML='×';
    del.style.cssText='position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:12px;line-height:1;cursor:pointer;';
    del.onclick=(e)=>{e.stopPropagation();binItems=binItems.filter(b=>b.id!==item.id);renderBin();};
    div.appendChild(del);

    // Click to add to stage
    div.addEventListener('click', () => addToStage(item));
    grid.appendChild(div);
  });
}

function addToStage(binItem) {
  const maxDim = 120;
  const scale = Math.min(maxDim / binItem.width, maxDim / binItem.height, 1);
  const w = Math.round(binItem.width * scale);
  const h = Math.round(binItem.height * scale);
  const id = 'stage_'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
  stageItems.push({
    id, binId: binItem.id,
    x: stageCanvas.width/2 - w/2,
    y: stageCanvas.height/2 - h/2,
    width: w, height: h,
    canvas: binItem.canvas
  });
  renderStage();
  showToast('Placed on stage! Drag to arrange.');
}

// --- Stage rendering ---
function renderStage() {
  stageCtx.fillStyle = '#f0ede6';
  stageCtx.fillRect(0, 0, stageCanvas.width, stageCanvas.height);
  // Grid dots
  stageCtx.fillStyle='#ddd8cd';
  for(let x=20;x<stageCanvas.width;x+=30)for(let y=20;y<stageCanvas.height;y+=30)
    stageCtx.fillRect(x,y,2,2);

  stageItems.forEach(item => {
    stageCtx.drawImage(item.canvas, item.x, item.y, item.width, item.height);
    if (item === dragItem) {
      stageCtx.strokeStyle='#e85d3a';stageCtx.lineWidth=2;stageCtx.setLineDash([4,4]);
      stageCtx.strokeRect(item.x-1,item.y-1,item.width+2,item.height+2);
      stageCtx.setLineDash([]);
    }
    // Draw small X button in top-right corner
    const xSize = 16;
    const xPadding = 4;
    const xX = item.x + item.width - xSize - xPadding;
    const xY = item.y + xPadding;
    // Store for hit detection
    if (!item._xButton) item._xButton = {};
    item._xButton.x = xX;
    item._xButton.y = xY;
    item._xButton.size = xSize;
    
    stageCtx.fillStyle = 'rgba(0,0,0,0.6)';
    stageCtx.fillRect(xX, xY, xSize, xSize);
    stageCtx.strokeStyle = '#fff';
    stageCtx.lineWidth = 1.5;
    stageCtx.beginPath();
    stageCtx.moveTo(xX+4, xY+4);
    stageCtx.lineTo(xX+xSize-4, xY+xSize-4);
    stageCtx.moveTo(xX+xSize-4, xY+4);
    stageCtx.lineTo(xX+4, xY+xSize-4);
    stageCtx.stroke();
  });
}

// --- Stage interaction ---
stageCanvas.addEventListener('pointerdown', (e) => {
  const rect = stageCanvas.getBoundingClientRect();
  const scaleX = stageCanvas.width / rect.width;
  const scaleY = stageCanvas.height / rect.height;
  const mx = (e.clientX - rect.left)*scaleX;
  const my = (e.clientY - rect.top)*scaleY;

  // Check if clicking X button first
  for (let i = stageItems.length - 1; i >= 0; i--) {
    const it = stageItems[i];
    if (it._xButton && mx >= it._xButton.x && mx <= it._xButton.x + it._xButton.size &&
        my >= it._xButton.y && my <= it._xButton.y + it._xButton.size) {
      // Show delete confirmation
      showDeleteConfirm(it, (confirmed) => {
        if (confirmed) {
          stageItems = stageItems.filter(s => s.id !== it.id);
          renderStage();
          showToast('Piece removed from stage');
        }
      });
      stageCanvas.setPointerCapture(e.pointerId);
      return;
    }
  }

  // Find topmost hit for dragging
  for (let i = stageItems.length - 1; i >= 0; i--) {
    const it = stageItems[i];
    if (mx >= it.x && mx <= it.x+it.width && my >= it.y && my <= it.y+it.height) {
      dragItem = it;
      dragOffsetX = mx - it.x;
      dragOffsetY = my - it.y;
      // Move to top
      stageItems.splice(i,1);
      stageItems.push(it);
      renderStage();
      stageCanvas.setPointerCapture(e.pointerId);
      return;
    }
  }
});

stageCanvas.addEventListener('pointermove', (e) => {
  if (!dragItem) return;
  const rect = stageCanvas.getBoundingClientRect();
  const scaleX = stageCanvas.width / rect.width;
  const scaleY = stageCanvas.height / rect.height;
  dragItem.x = (e.clientX - rect.left)*scaleX - dragOffsetX;
  dragItem.y = (e.clientY - rect.top)*scaleY - dragOffsetY;
  renderStage();
});

stageCanvas.addEventListener('pointerup', () => { dragItem = null; renderStage(); });

// Delete confirmation modal
function showDeleteConfirm(item, callback) {
  const confirmDiv = document.createElement('div');
  confirmDiv.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:flex;align-items:center;justify-content:center;';
  
  const modal = document.createElement('div');
  modal.style.cssText = 'background:#333;color:#f0ede6;padding:20px;border-radius:8px;text-align:center;';
  
  const msg = document.createElement('p');
  msg.style.cssText = 'margin:0 0 16px 0;font-size:14px;font-weight:600;';
  msg.textContent = 'Remove this piece from the stage?';
  modal.appendChild(msg);
  
  const btnGroup = document.createElement('div');
  btnGroup.style.cssText = 'display:flex;gap:8px;justify-content:center;';
  
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn-primary btn-sm';
  confirmBtn.textContent = 'Remove';
  confirmBtn.onclick = () => {
    confirmDiv.remove();
    callback(true);
  };
  btnGroup.appendChild(confirmBtn);
  
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn-secondary btn-sm';
  cancelBtn.textContent = 'Keep It';
  cancelBtn.onclick = () => {
    confirmDiv.remove();
    callback(false);
  };
  btnGroup.appendChild(cancelBtn);
  
  modal.appendChild(btnGroup);
  confirmDiv.appendChild(modal);
  document.body.appendChild(confirmDiv);
}

// Double-click to remove from stage
stageCanvas.addEventListener('dblclick', (e) => {
  const rect = stageCanvas.getBoundingClientRect();
  const scaleX = stageCanvas.width / rect.width;
  const scaleY = stageCanvas.height / rect.height;
  const mx = (e.clientX - rect.left)*scaleX;
  const my = (e.clientY - rect.top)*scaleY;
  for (let i = stageItems.length - 1; i >= 0; i--) {
    const it = stageItems[i];
    if (mx >= it.x && mx <= it.x+it.width && my >= it.y && my <= it.y+it.height) {
      stageItems.splice(i,1);
      renderStage();
      showToast('Piece removed from stage');
      return;
    }
  }
});

// --- Frame capture ---
function captureFrame() {
  if (stageItems.length === 0 && frames.length === 0) {
    showToast('Add some pieces to the stage first!');
    return;
  }
  const dataURL = stageCanvas.toDataURL('image/png');
  frames.push(dataURL);
  renderTimeline();
  showToast(`Frame ${frames.length} captured!`);
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  document.getElementById('frameCount').textContent = frames.length + ' frame' + (frames.length !== 1 ? 's' : '');
  tl.innerHTML = '';
  frames.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'timeline-frame rounded';
    div.style.cssText = 'width:80px;height:50px;background:#333;overflow:hidden;position:relative;';
    div.innerHTML = `<img src="${f}" style="width:100%;height:100%;object-fit:cover;" loading="lazy"><span style="position:absolute;bottom:1px;right:3px;font-size:9px;color:#fff;text-shadow:0 1px 2px #000;">${i+1}</span>`;
    // Delete on right-click or long-press alternative: add small X
    const del = document.createElement('button');
    del.innerHTML='×';
    del.style.cssText='position:absolute;top:1px;right:1px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:14px;height:14px;font-size:10px;line-height:1;cursor:pointer;display:none;';
    del.onclick=(e)=>{e.stopPropagation();frames.splice(i,1);renderTimeline();showToast('Frame removed');};
    div.appendChild(del);
    div.onmouseenter=()=>del.style.display='block';
    div.onmouseleave=()=>del.style.display='none';
    tl.appendChild(div);
  });
}

// --- Animation speed control ---
let currentAnimationDelay = 1000;

function updateAnimationSpeed(delayMs) {
  currentAnimationDelay = parseInt(delayMs);
  showToast(`Animation speed set to ${delayMs}ms per frame`);
}

// --- GIF Export ---
function exportGIF() {
  if (frames.length === 0) { showToast('Capture some frames first!'); return; }
  showToast('Encoding GIF...');

  const w = stageCanvas.width, h = stageCanvas.height;
  const encoder = new GIFEncoder(w, h);
  encoder.setDelay(currentAnimationDelay);

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = w; tempCanvas.height = h;
  const tempCtx = tempCanvas.getContext('2d');

  // Load all images first, then encode in order
  let loaded = 0;
  const images = new Array(frames.length);

  frames.forEach((f, i) => {
    const img = new Image();
    img.onload = () => {
      images[i] = img;
      loaded++;
      if (loaded === frames.length) {
        // All images loaded, now encode frames in order
        for (let j = 0; j < images.length; j++) {
          tempCtx.fillStyle = '#f0ede6';
          tempCtx.fillRect(0, 0, w, h);
          tempCtx.drawImage(images[j], 0, 0, w, h);
          encoder.addFrame(tempCtx);
        }
        const data = encoder.finish();
        const blob = new Blob([data], {type:'image/gif'});
        const dataURL = URL.createObjectURL(blob);
        
        // Add to GIF bin instead of auto-downloading
        const id = 'gif_'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
        exportedGIFs.push({id, blob, dataURL, timestamp: new Date().toLocaleTimeString()});
        renderGIFs();
        switchSidebar('gifs');
        showToast('GIF ready in GIFs panel!');
      }
    };
    img.onerror = () => {
      loaded++;
      if (loaded === frames.length) {
        showToast('Error encoding GIF');
      }
    };
    img.src = f;
  });
}

function renderGIFs() {
  const grid = document.getElementById('gifsGrid');
  grid.innerHTML = '';
  if (exportedGIFs.length === 0) {
    grid.innerHTML = '<p style="color:#666;font-size:11px;">No GIFs yet. Export one above!</p>';
    return;
  }
  exportedGIFs.forEach(gif => {
    const div = document.createElement('div');
    div.className = 'rounded-lg overflow-hidden cursor-pointer';
    div.style.cssText = 'background:#333;display:flex;flex-direction:column;gap:6px;padding:6px;transition:transform .15s;';
    div.onmouseenter = () => div.style.transform = 'scale(1.05)';
    div.onmouseleave = () => div.style.transform = 'scale(1)';
    
    const preview = document.createElement('img');
    preview.style.cssText = 'width:100%;height:auto;border-radius:4px;background:#222;aspect-ratio:16/9;object-fit:contain;cursor:pointer;';
    preview.src = gif.dataURL;
    preview.onerror = () => {
      preview.style.display = 'none';
      const fallback = document.createElement('div');
      fallback.style.cssText = 'width:100%;aspect-ratio:16/9;border-radius:4px;background:#222;display:flex;align-items:center;justify-content:center;color:#888;font-size:11px;';
      fallback.textContent = 'GIF Preview';
      div.insertBefore(fallback, div.firstChild);
    };
    div.appendChild(preview);
    
    // Click preview to open lightbox
    preview.onclick = (e) => {
      e.stopPropagation();
      openLightbox(gif.dataURL, gif.timestamp);
    };
    
    const info = document.createElement('p');
    info.style.cssText = 'font-size:10px;color:#aaa;margin:0;text-align:center;';
    info.textContent = gif.timestamp;
    div.appendChild(info);
    const btnContainer = document.createElement('div');
    btnContainer.style.cssText = 'display:flex;gap:4px;';
    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn-primary btn-sm';
    dlBtn.style.cssText = 'flex:1;padding:4px 8px;font-size:11px;';
    dlBtn.innerHTML = '<i data-lucide="download" style="width:12px;height:12px;display:inline;vertical-align:middle;"></i>';
    dlBtn.onclick = (e) => {
      e.stopPropagation();
      const a = document.createElement('a');
      a.href = gif.dataURL;
      a.download = 'stop-motion-'+Date.now()+'.gif';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('GIF downloaded!');
    };
    btnContainer.appendChild(dlBtn);
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-secondary btn-sm';
    delBtn.style.cssText = 'flex:1;padding:4px 8px;font-size:11px;';
    delBtn.textContent = '×';
    delBtn.onclick = (e) => {
      e.stopPropagation();
      exportedGIFs = exportedGIFs.filter(g => g.id !== gif.id);
      URL.revokeObjectURL(gif.dataURL);
      renderGIFs();
      showToast('GIF removed');
    };
    btnContainer.appendChild(delBtn);
    div.appendChild(btnContainer);
    grid.appendChild(div);
  });
  setTimeout(() => lucide.createIcons(), 50);
}

function openLightbox(gifDataURL, timestamp) {
  const lightbox = document.getElementById('gifLightbox');
  document.getElementById('lightboxImage').src = gifDataURL;
  document.getElementById('lightboxInfo').textContent = 'Created: ' + timestamp;
  lightbox.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('gifLightbox').style.display = 'none';
  document.body.style.overflow = '';
}

// --- Copy HTML Code to Clipboard ---
function copyHTMLCode() {
  const htmlCode = document.documentElement.outerHTML;
  navigator.clipboard.writeText(htmlCode).then(() => {
    showToast('HTML code copied to clipboard! 📋');
  }).catch(err => {
    console.error('Failed to copy:', err);
    showToast('Failed to copy. Try again!');
  });
}

// --- Toast ---
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// --- Element SDK ---
const defaultConfig = {
  stage_title: 'Stop Motion Studio',
  background_color: '#1a1a1e',
  surface_color: '#222228',
  text_color: '#f0ede6',
  accent_color: '#e85d3a',
  secondary_color: '#2a2a2a',
  font_family: 'DM Sans',
  font_size: 14
};

function applyConfig(config) {
  const c = {...defaultConfig, ...config};
  document.getElementById('projectTitle').textContent = c.stage_title;
  document.querySelector('.app-wrap').style.background = c.background_color;
  document.querySelectorAll('header, aside, [style*="border-top"]').forEach(el => {
    if (el.tagName === 'HEADER' || el.tagName === 'ASIDE') el.style.background = c.surface_color;
    if (el.style.borderTop) el.style.background = c.surface_color;
  });
  document.getElementById('projectTitle').style.color = c.text_color;
  document.querySelectorAll('.btn-primary').forEach(b => b.style.background = c.accent_color);
  document.querySelectorAll('.btn-secondary').forEach(b => b.style.background = c.secondary_color);
  document.body.style.fontFamily = `${c.font_family}, DM Sans, sans-serif`;
  document.querySelectorAll('h1').forEach(el => el.style.fontSize = `${c.font_size * 1.4}px`);
}

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => applyConfig(config),
  mapToCapabilities: (config) => ({
    recolorables: [
      {get:()=>config.background_color||defaultConfig.background_color,set:v=>{config.background_color=v;window.elementSdk.setConfig({background_color:v})}},
      {get:()=>config.surface_color||defaultConfig.surface_color,set:v=>{config.surface_color=v;window.elementSdk.setConfig({surface_color:v})}},
      {get:()=>config.text_color||defaultConfig.text_color,set:v=>{config.text_color=v;window.elementSdk.setConfig({text_color:v})}},
      {get:()=>config.accent_color||defaultConfig.accent_color,set:v=>{config.accent_color=v;window.elementSdk.setConfig({accent_color:v})}},
      {get:()=>config.secondary_color||defaultConfig.secondary_color,set:v=>{config.secondary_color=v;window.elementSdk.setConfig({secondary_color:v})}}
    ],
    borderables: [],
    fontEditable: {get:()=>config.font_family||defaultConfig.font_family,set:v=>{config.font_family=v;window.elementSdk.setConfig({font_family:v})}},
    fontSizeable: {get:()=>config.font_size||defaultConfig.font_size,set:v=>{config.font_size=v;window.elementSdk.setConfig({font_size:v})}}
  }),
  mapToEditPanelValues: (config) => new Map([
    ['stage_title', config.stage_title || defaultConfig.stage_title]
  ])
});

lucide.createIcons();
